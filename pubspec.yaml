name: lema
description: "Content operating system for creators: schedule, publish, and track posts."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  table_calendar: ^3.3.0
  intl: ^0.20.3
  file_picker: ^13.1.0
  video_player: ^2.14.1
  google_generative_ai: ^0.4.7
  http: ^1.6.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/samples/
